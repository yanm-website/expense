<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心智账本</title>
    <style>
        /* 苹果系统级颜色与基础设定 (原封不动保留) */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-sub: #8E8E93;
            --apple-blue: #007AFF;
            --input-bg: #F2F2F7;
            --divider: rgba(60, 60, 67, 0.08); 
            --table-zoom: 1rem;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. 主界面白板 */
        #main-dashboard {
            width: 70%; 
            max-width: 900px;
            height: 75vh; 
            background: var(--card-bg);
            border-radius: 36px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); 
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow: hidden;
        }

        .quadrant {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .quadrant:nth-child(1) { border-right: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
        .quadrant:nth-child(2) { border-bottom: 1px solid var(--divider); }
        .quadrant:nth-child(3) { border-right: 1px solid var(--divider); }

        .quadrant h2 { font-size: 1.2rem; color: var(--text-sub); font-weight: 500; margin-bottom: 12px; }
        .quadrant .balance { font-size: 2.5rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; transition: color 0.3s; }

        /* 2. 齿轮设置按钮 */
        #settings-btn {
            position: fixed;
            top: 40px; 
            right: 40px; 
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #FFD700, #FF8C00); 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); 
            border: 3px solid #FFF; 
            transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 10;
        }
        #settings-btn:hover { transform: scale(1.05) rotate(15deg); }
        #settings-btn svg { width: 34px; height: 34px; color: #FFF; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        /* 齿轮下拉菜单 */
        #settings-dropdown {
            position: fixed;
            top: 115px; 
            right: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 20;
            width: 200px;
        }
        .dropdown-item {
            padding: 15px 20px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--divider);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(0,0,0,0.05); }

        /* 左上角表格(Excel)按钮 */
        #table-btn {
            position: fixed;
            top: 40px; 
            left: 40px; 
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #107C41, #18A558); 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 124, 65, 0.3), inset 0 -4px 0 rgba(0,0,0,0.1); 
            border: 3px solid #FFF; 
            transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 10;
        }
        #table-btn:hover { transform: scale(1.05); }
        #table-btn svg { width: 34px; height: 34px; color: #FFF; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        /* 3. 悬浮加号按钮 */
        #add-btn {
            position: fixed; 
            bottom: 40px;
            right: 40px;
            width: 65px;
            height: 65px;
            background: var(--apple-blue); 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.35); 
            transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1); 
            z-index: 10;
        }
        #add-btn:hover { transform: scale(1.05); }
        #add-btn svg { width: 38px; height: 38px; color: white; display: block; }

        /* 4. 通用遮罩 */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        /* 5. 齿轮设置卡片 */
        #settings-card {
            background: rgba(255, 255, 255, 0.95); width: 80%; max-width: 400px; 
            border-radius: 28px; padding: 30px 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; gap: 20px;
        }
        #settings-card h3 { margin: 0 0 10px 0; text-align: center; font-size: 1.3rem; color: var(--text-main); }

        /* 删除内容弹窗 */
        #delete-card {
            background: rgba(255, 255, 255, 0.95); width: 85%; max-width: 800px; height: 70vh;
            border-radius: 28px; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
        }
        #delete-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-top: 15px;
            padding-right: 10px;
        }
        .delete-item {
            display: flex; align-items: center; background: var(--input-bg); padding: 15px; border-radius: 16px;
        }
        .del-btn {
            background: #FF3B30; color: white; border: none; border-radius: 50%; width: 32px; height: 32px;
            display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px;
            cursor: pointer; margin-right: 15px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(255,59,48,0.3);
        }
        .del-btn:hover { transform: scale(1.1); }
        .del-info { flex: 1; font-size: 1.05rem; color: var(--text-main); display: flex; flex-direction: column; gap: 5px; }
        .del-time { font-size: 0.85rem; color: var(--text-sub); }

        /* Excel表格弹窗 */
        #table-card {
            background: rgba(255, 255, 255, 0.95); width: 95%; max-width: 1400px; height: 85vh;
            border-radius: 28px; padding: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; position: relative;
        }
        #zoom-controls {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 10px;
        }
        .zoom-btn {
            background: var(--input-bg); border: none; padding: 5px 15px; border-radius: 12px;
            font-size: 1.2rem; cursor: pointer; color: var(--text-main); font-weight: bold;
        }
        #table-wrapper {
            flex: 1; overflow: auto; border-radius: 12px; border: 1px solid var(--divider);
            font-size: var(--table-zoom); 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { border: 1px solid var(--divider); padding: 0.6em; }
        th { 
            position: sticky; top: 0; background: #EFEFEF; z-index: 2; 
            color: #333; font-weight: bold; 
        }
        td { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

        /* 6. 记账表单卡片 */
        .form-container {
            background: rgba(255, 255, 255, 0.95); width: 85%; max-width: 900px;
            border-radius: 32px; padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .column { display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; align-items: center; gap: 15px; }
        .label { width: 100px; font-weight: 500; font-size: 1.05rem; color: var(--text-main); text-align: right; line-height: 1.3;}
        input, select { flex: 1; padding: 12px 16px; border: none; border-radius: 14px; background: var(--input-bg); font-size: 1.1rem; color: var(--text-main); outline: none; transition: background 0.2s; }
        input:focus, select:focus { background: #E5E5EA; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 14px; padding-right: 35px; }
        #total-price { font-weight: 700; color: var(--apple-blue); background: rgba(0, 122, 255, 0.05); }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 10px; }
        .btn { padding: 12px 36px; border-radius: 20px; border: none; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: var(--input-bg); color: var(--text-main); }
        .btn-confirm { background: var(--apple-blue); color: #ffffff; }
        .close-top-btn { align-self: flex-end; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-sub); margin-bottom: 10px;}
    </style>
</head>
<body>

    <!-- 左上角 Excel 表格按钮 -->
    <div id="table-btn" onclick="openTable()">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 3h16c.55 0 1 .45 1 1v16c0 .55-.45 1-1 1H4c-.55 0-1-.45-1-1V4c0-.55.45-1 1-1zm1 2v3h4V5H5zm6 0v3h4V5h-4zm6 0v3h4V5h-4zM5 10v4h4v-4H5zm6 0v4h4v-4h-4zm6 0v4h4v-4h-4zM5 16v3h4v-3H5zm6 0v3h4v-3h-4zm6 0v3h4v-3h-4z"></path>
        </svg>
    </div>

    <!-- 主界面白板 -->
    <div id="main-dashboard">
        <div class="quadrant">
            <h2>TNG 余额</h2>
            <div id="tng-val" class="balance">RM 0.00</div>
        </div>
        <div class="quadrant">
            <h2>Maybank 余额</h2>
            <div id="maybank-val" class="balance">RM 0.00</div>
        </div>
        <div class="quadrant">
            <h2>伙食费</h2>
            <div id="food-val" class="balance">RM 0.00</div>
        </div>
        <div class="quadrant">
            <h2>零花钱余额</h2>
            <div id="pocket-val" class="balance">RM 0.00</div>
        </div>
    </div>

    <!-- 齿轮按钮 -->
    <div id="settings-btn" onclick="toggleDropdown(event)">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"></path>
        </svg>
    </div>

    <!-- 齿轮下拉菜单 -->
    <div id="settings-dropdown">
        <div class="dropdown-item" onclick="openSettings()">资产初始金额设置</div>
        <div class="dropdown-item" onclick="openDeleteUI()">删除内容</div>
    </div>
    
    <!-- 加号按钮 -->
    <div id="add-btn" onclick="openForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </div>

    <!-- Excel表格弹窗 -->
    <div id="table-overlay" class="overlay">
        <div id="table-card">
            <button class="close-top-btn" onclick="closeTable()">关闭 ✖</button>
            <div id="zoom-controls">
                <button class="zoom-btn" onclick="zoomTable(-0.1)">➖ 缩小</button>
                <button class="zoom-btn" onclick="zoomTable(0.1)">➕ 放大</button>
            </div>
            <div id="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>年份</th>
                            <th>日期</th>
                            <th>时间</th>
                            <th>用途</th>
                            <th>物品名称</th>
                            <th>数量</th>
                            <th>金额</th>
                            <th>服务费</th>
                            <th>SST</th>
                            <th>总价</th>
                            <th>支付方式</th>
                            <th>地点</th>
                            <th>TNG余额</th>
                            <th>Maybank余额</th>
                            <th>伙食费</th>
                            <th>零花钱</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- 数据行由JS生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 删除内容弹窗 -->
    <div id="delete-overlay" class="overlay">
        <div id="delete-card">
            <button class="close-top-btn" onclick="closeDeleteUI()">关闭 ✖</button>
            <h3 style="margin-top:0; text-align:center;">删除历史记录</h3>
            <div id="delete-list">
                <!-- 删除项由JS生成 -->
            </div>
        </div>
    </div>

    <!-- 齿轮设置弹窗 -->
    <div id="settings-overlay" class="overlay">
        <div id="settings-card">
            <h3>资产初始金额设置</h3>
            <div class="row">
                <span class="label">TNG<br>金额</span>
                <input type="number" id="set-tng" placeholder="">
            </div>
            <div class="row">
                <span class="label">Maybank<br>金额</span>
                <input type="number" id="set-maybank" placeholder="">
            </div>
            <div class="row">
                <span class="label">伙食费</span>
                <input type="number" id="set-food" placeholder="">
            </div>
            <div class="row">
                <span class="label">零花钱余额</span>
                <input type="number" id="set-pocket" placeholder="">
            </div>
            
            <div class="nav-btns">
                <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn btn-confirm" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <!-- 记账表单弹窗 -->
    <div id="form-overlay" class="overlay">
        <div class="form-container">
            <div class="form-grid">
                <div class="column">
                    <div class="row"><span class="label">年份</span><input type="text" id="year"></div>
                    <div class="row"><span class="label">日期</span><input type="text" id="date"></div>
                    <div class="row"><span class="label">时间</span><input type="text" id="time"></div>
                    
                    <div class="row"><span class="label">用途</span>
                        <input type="text" id="purpose" list="purpose-options">
                        <datalist id="purpose-options">
                            <option value="早餐"></option>
                            <option value="午餐"></option>
                            <option value="晚餐"></option>
                        </datalist>
                    </div>

                    <div class="row"><span class="label">物品名称</span><input type="text" id="item-name"></div>
                    <div class="row"><span class="label">数量</span><input type="number" id="qty" value="1"></div>
                </div>

                <div class="column">
                    <div class="row"><span class="label">金额</span><input type="text" id="amount-expr" oninput="calculateTotal()"></div>
                    <div class="row"><span class="label">服务费</span><input type="number" id="service-fee" value="0" oninput="calculateTotal()"></div>
                    <div class="row"><span class="label">SST</span><input type="number" id="sst-fee" value="0" oninput="calculateTotal()"></div>
                    <div class="row"><span class="label">总价</span><input type="text" id="total-price" readonly></div>
                    
                    <div class="row"><span class="label">支付方式</span>
                        <select id="pay-method">
                            <option value="TNG">TNG</option>
                            <option value="Maybank">Maybank</option>
                        </select>
                    </div>
                    
                    <div class="row"><span class="label">地点</span><input type="text" id="location"></div>
                </div>
            </div>

            <div class="nav-btns">
                <button class="btn btn-cancel" onclick="closeForm()">返回</button>
                <button class="btn btn-confirm" onclick="submitData()">完成</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 新增：JSONbin 云端数据引擎配置
        // ==========================================
        const API_KEY = "$2a$10$wMi0hs1j8z3avrDPrAIDEeBxC15MlrFUV9SIdKMxtYwQHKCw76GDy";
        const BIN_ID = "69fac08eaaba8821977809ce";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // --- 数据存储核心 ---
        let initialWallet = { tng: 0, maybank: 0, food: 0, pocket: 0 };
        let records = []; 
        let currentZoom = 1.0;

        // 🚀 新增功能 1：页面一打开，立刻去云端下载记忆
        window.onload = async function() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.record) {
                        if (data.record.initialWallet) initialWallet = data.record.initialWallet;
                        if (data.record.records) records = data.record.records;
                    }
                } else {
                    console.log("云端尚无数据或读取失败，使用初始空白状态。");
                }
            } catch (error) {
                console.error("网络请求错误，无法加载云端数据:", error);
            } finally {
                recalculateAll(); // 数据下载完后，立刻把屏幕上的字刷成最新的！
            }
        };

        // 🚀 新增功能 2：后台自动把最新数据保存到云端的动作
        async function syncToCloud() {
            const payload = {
                initialWallet: initialWallet,
                records: records
            };
            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    alert("⚠️ 哎呀！数据同步到云端失败了，请检查网络！");
                }
            } catch (error) {
                console.error("同步失败:", error);
                alert("⚠️ 数据同步失败，请检查网络连接！");
            }
        }
        // ==========================================


        // 点击空白处关闭下拉菜单
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('settings-dropdown');
            const btn = document.getElementById('settings-btn');
            if (dropdown.style.display === 'flex' && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function toggleDropdown(e) {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
        }

        // --- 资产设置逻辑 ---
        function openSettings() {
            document.getElementById('settings-dropdown').style.display = 'none';
            document.getElementById('settings-overlay').style.display = 'flex';
            document.getElementById('set-tng').value = initialWallet.tng || '';
            document.getElementById('set-maybank').value = initialWallet.maybank || '';
            document.getElementById('set-food').value = initialWallet.food || '';
            document.getElementById('set-pocket').value = initialWallet.pocket || '';
        }

        function closeSettings() {
            document.getElementById('settings-overlay').style.display = 'none';
        }

        function saveSettings() {
            initialWallet.tng = parseFloat(document.getElementById('set-tng').value) || 0;
            initialWallet.maybank = parseFloat(document.getElementById('set-maybank').value) || 0;
            initialWallet.food = parseFloat(document.getElementById('set-food').value) || 0;
            initialWallet.pocket = parseFloat(document.getElementById('set-pocket').value) || 0;
            
            recalculateAll(); 
            closeSettings();
            syncToCloud(); // 🚀 保存设置后，触发云端同步！
        }

        // --- 删除内容逻辑 ---
        function openDeleteUI() {
            document.getElementById('settings-dropdown').style.display = 'none';
            document.getElementById('delete-overlay').style.display = 'flex';
            renderDeleteList();
        }

        function closeDeleteUI() {
            document.getElementById('delete-overlay').style.display = 'none';
        }

        function renderDeleteList() {
            const list = document.getElementById('delete-list');
            list.innerHTML = '';
            records.forEach(r => {
                const item = document.createElement('div');
                item.className = 'delete-item';
                item.innerHTML = `
                    <button class="del-btn" onclick="deleteRecord('${r.id}')">❌</button>
                    <div class="del-info">
                        <div>花销：${r.payMethod} 扣除 RM${r.total} (${r.purpose} - ${r.itemName || '无名称'})</div>
                        <div class="del-time">记录建立时间：${r.creationTime}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            recalculateAll(); 
            renderDeleteList(); 
            syncToCloud(); // 🚀 删除记录后，触发云端同步！
        }

        // --- Excel 表格逻辑 ---
        function openTable() {
            document.getElementById('table-overlay').style.display = 'flex';
            renderTable();
        }

        function closeTable() {
            document.getElementById('table-overlay').style.display = 'none';
        }

        function zoomTable(change) {
            currentZoom += change;
            if(currentZoom < 0.5) currentZoom = 0.5;
            if(currentZoom > 2.0) currentZoom = 2.0;
            document.documentElement.style.setProperty('--table-zoom', currentZoom + 'rem');
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            let runTng = initialWallet.tng;
            let runMaybank = initialWallet.maybank;
            let runFood = initialWallet.food;
            let runPocket = initialWallet.pocket;

            records.forEach(r => {
                if (r.payMethod === 'TNG') runTng -= parseFloat(r.total);
                else runMaybank -= parseFloat(r.total);

                if (['早餐', '午餐', '晚餐'].includes(r.purpose)) runFood -= parseFloat(r.total);
                else runPocket -= parseFloat(r.total);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.year}</td>
                    <td>${r.date}</td>
                    <td>${r.time}</td>
                    <td>${r.purpose}</td>
                    <td>${r.itemName}</td>
                    <td>${r.qty}</td>
                    <td>${r.amountExpr}</td>
                    <td>${r.serviceFee || ''}</td>
                    <td>${r.sst || ''}</td>
                    <td>RM${r.total}</td>
                    <td>${r.payMethod}</td>
                    <td>${r.location}</td>
                    <td>RM${runTng.toFixed(2)}</td>
                    <td>RM${runMaybank.toFixed(2)}</td>
                    <td>RM${runFood.toFixed(2)}</td>
                    <td>RM${runPocket.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- 记账与统筹核心 ---
        function openForm() {
            document.getElementById('form-overlay').style.display = 'flex';
            const now = new Date();
            document.getElementById('year').value = now.getFullYear();
            document.getElementById('date').value = (now.getMonth() + 1) + '.' + now.getDate();
            
            let h = now.getHours();
            let m = now.getMinutes();
            let ampm = h >= 12 ? 'pm' : 'am';
            h = h % 12; h = h ? h : 12; 
            m = m < 10 ? '0'+m : m;
            document.getElementById('time').value = `${h}:${m}${ampm}`;
        }

        function closeForm() {
            document.getElementById('form-overlay').style.display = 'none';
            document.getElementById('amount-expr').value = '';
            document.getElementById('total-price').value = '';
            document.getElementById('service-fee').value = '0';
            document.getElementById('sst-fee').value = '0';
            document.getElementById('item-name').value = '';
            document.getElementById('location').value = '';
        }

        function calculateTotal() {
            let expr = document.getElementById('amount-expr').value.replace(/星/g, '*');
            let totalInput = document.getElementById('total-price');
            try {
                let base = expr ? eval(expr) : 0; 
                let srv = parseFloat(document.getElementById('service-fee').value) || 0;
                let sst = parseFloat(document.getElementById('sst-fee').value) || 0;
                totalInput.value = (base + srv + sst).toFixed(2);
            } catch(e) { 
                totalInput.value = "计算中..."; 
            }
        }

        function submitData() {
            let finalTotal = document.getElementById('total-price').value;
            if(!finalTotal || finalTotal === "计算中..." || finalTotal === "0.00") {
                alert("请先填写正确的金额！");
                return;
            }

            const now = new Date();
            const creationTime = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;

            let newRecord = {
                id: Date.now().toString(),
                creationTime: creationTime,
                year: document.getElementById('year').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                purpose: document.getElementById('purpose').value,
                itemName: document.getElementById('item-name').value,
                qty: document.getElementById('qty').value,
                amountExpr: document.getElementById('amount-expr').value,
                serviceFee: document.getElementById('service-fee').value,
                sst: document.getElementById('sst-fee').value,
                total: finalTotal,
                payMethod: document.getElementById('pay-method').value,
                location: document.getElementById('location').value
            };

            records.push(newRecord);
            recalculateAll(); 
            closeForm();
            syncToCloud(); // 🚀 添加新账目后，触发云端同步！
        }

        function recalculateAll() {
            let currentTng = initialWallet.tng;
            let currentMaybank = initialWallet.maybank;
            let currentFood = initialWallet.food;
            let currentPocket = initialWallet.pocket;

            records.forEach(r => {
                if (r.payMethod === 'TNG') currentTng -= parseFloat(r.total);
                else currentMaybank -= parseFloat(r.total);

                if (['早餐', '午餐', '晚餐'].includes(r.purpose)) currentFood -= parseFloat(r.total);
                else currentPocket -= parseFloat(r.total);
            });

            document.getElementById('tng-val').innerText = 'RM ' + currentTng.toFixed(2);
            document.getElementById('maybank-val').innerText = 'RM ' + currentMaybank.toFixed(2);
            document.getElementById('food-val').innerText = 'RM ' + currentFood.toFixed(2);
            document.getElementById('pocket-val').innerText = 'RM ' + currentPocket.toFixed(2);
        }
    </script>
</body>
</html>
